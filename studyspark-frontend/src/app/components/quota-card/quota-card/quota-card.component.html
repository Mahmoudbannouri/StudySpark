<div class="quota-card p-4 shadow rounded bg-white">
    <h5 class="fw-bold text-primary mb-3">📊 Quota Summary</h5>
  
    <div class="row">
      <div class="col-md-6">
        <label class="form-label fw-semibold">Max Uploads</label>
        <input *ngIf="editable" [(ngModel)]="localQuota.maxUploads" type="number" class="form-control" />
        <p *ngIf="!editable" class="text-secondary">{{ quota.maxUploads }}</p>
      </div>
  
      <div class="col-md-6">
        <label class="form-label fw-semibold">Used Uploads</label>
        <p class="text-danger">{{ quota.usedUploads }}</p>
      </div>
    </div>
  
    <div class="row mt-3">
      <div class="col-md-6">
        <label class="form-label fw-semibold">Max AI Requests</label>
        <input *ngIf="editable" [(ngModel)]="localQuota.maxAIRequests" type="number" class="form-control" />
        <p *ngIf="!editable" class="text-secondary">{{ quota.maxAIRequests }}</p>
      </div>
  
      <div class="col-md-6">
        <label class="form-label fw-semibold">Used AI Requests</label>
        <p class="text-danger">{{ quota.usedAIRequests }}</p>
      </div>
    </div>
  
    <div class="mt-4 text-end" *ngIf="editable">
      <button class="btn btn-primary px-4" (click)="saveChanges()">💾 Save Changes</button>
    </div>
  </div>
