<div class="admin-page">
  <!-- Top Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-gradient-admin shadow-sm">
    <div class="container-fluid px-4">
      <a class="navbar-brand fw-bold" href="#">
        <span class="brand-icon">⚡</span> StudySpark Admin
      </a>
      <div class="d-flex align-items-center gap-3">
        <span class="badge bg-warning text-dark px-3 py-2 rounded-pill">
          <i class="bi bi-shield-check me-1"></i> Administrator
        </span>
        <button class="btn btn-outline-light btn-sm rounded-pill" (click)="logout()">
          <i class="bi bi-box-arrow-right me-1"></i> Logout
        </button>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container py-5">
    <div class="admin-header mb-5">
      <h2 class="fw-bold text-gradient mb-2">🛠 Admin Control Panel</h2>
      <p class="text-muted">Manage users, roles, and quotas</p>
    </div>

    <div class="card shadow-sm rounded-4 border-0 mb-4">
      <div class="card-header bg-transparent border-0 pt-4 px-4">
        <h5 class="fw-semibold mb-0">User Management</h5>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th class="px-4">ID</th>
                <th>Fullname</th>
                <th>Email</th>
                <th>Role</th>
                <th>Quota</th>
                <th class="text-end px-4">Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let user of users" class="border-bottom">
                <td class="px-4 fw-semibold text-muted">#{{ user.id }}</td>
                <td class="fw-semibold">{{ user.fullname }}</td>
                <td class="text-muted">{{ user.email }}</td>
                <td>
                  <span class="badge" [ngClass]="user.role === 'admin' ? 'bg-danger' : 'bg-primary'">
                    {{ user.role }}
                  </span>
                </td>
                <td>
                  <button class="btn btn-sm btn-outline-primary rounded-pill" (click)="viewQuota(user.id)">
                    <i class="bi bi-eye me-1"></i> View/Edit
                  </button>
                </td>
                <td class="text-end px-4">
                  <div class="btn-group" role="group">
                    <button class="btn btn-sm btn-outline-success" (click)="changeRole(user, 'admin')" title="Make Admin">
                      <i class="bi bi-shield-check"></i>
                    </button>
                    <button class="btn btn-sm btn-outline-secondary" (click)="changeRole(user, 'student')" title="Make Student">
                      <i class="bi bi-person"></i>
                    </button>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div *ngIf="selectedQuota" class="quota-editor-section">
      <h5 class="fw-semibold mb-3">Edit User Quota</h5>
      <app-quota-card [quota]="selectedQuota" [editable]="true" (save)="saveQuotaChanges($event)"></app-quota-card>
    </div>
  </div>
</div>
