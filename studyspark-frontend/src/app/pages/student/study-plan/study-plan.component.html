<div class="student-layout">
  <app-sidebar></app-sidebar>

  <div class="main-content">
    <header class="top-header">
      <div class="header-content">
        <div class="header-left">
          <h1 class="page-title">📅 AI Study Planner</h1>
          <p class="page-subtitle">Smart scheduling based on your documents and goals</p>
        </div>
        <div class="header-right" *ngIf="user">
          <div class="user-badge">
            <span class="user-name"><i class="bi bi-person-circle"></i> {{ user.fullname }}</span>
            <span class="user-id">Name: {{ user.fullname }}</span>
          </div>
        </div>
      </div>
    </header>

    <div class="content-area">
      <div class="study-plan-container">
        <!-- Calendar Section -->
        <div class="calendar-section">
          <div class="current-plan" *ngIf="currentPlan">
            <div>
              <h3><i class="bi bi-calendar-check"></i> Your Study Plan</h3>
              <p class="plan-meta" *ngIf="currentPlan?.documents?.length">
                {{ currentPlan.documents.length }} documents •
                
                {{ currentPlan.dailyHours }}h/day
              </p>
            </div>
            
          
        </div>
          <div class="calendar-header">
            
            <button class="btn-ai-preferences" (click)="openPreferences()">
              <i class="bi bi-stars"></i> AI Preferences
            </button>
          </div>

          <!-- Full Calendar -->
            <div class="calendar-wrapper">
              <full-calendar [options]="calendarOptions"></full-calendar>
            </div>

          <!-- Preferences Modal -->
          <app-preferences-modal
            [show]="showPreferencesModal"
            [availableDocuments]="availableDocuments"
            (close)="closePreferences()"
            (save)="savePreferences($event)"
            (generate)="generatePlan($event)">
          </app-preferences-modal>
        </div>

        <!-- Current Plan Section (Future integration) -->
        
      </div>
    </div>
  </div>
</div>
