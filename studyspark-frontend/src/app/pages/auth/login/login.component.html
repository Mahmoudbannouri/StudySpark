<div class="auth-page">
  <div class="floating-shape"></div>
  <div class="floating-shape delay"></div>

  <div class="auth-card shadow-lg p-5 rounded-4">
    <div class="text-center mb-4">
      <div class="auth-icon mb-3">🔐</div>
      <h2 class="fw-bold text-gradient mb-2">Welcome to StudySpark</h2>
      <p class="text-muted">Continue your learning journey</p>
    </div>

    <form (ngSubmit)="onLogin()">
      <div class="mb-3">
        <label class="form-label fw-semibold">Email Address</label>
        <input
          type="email"
          class="form-control form-control-lg rounded-3"
          [(ngModel)]="email"
          name="email"
          required
          placeholder="student@email.com"
        />
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Password</label>
        <input
          type="password"
          class="form-control form-control-lg rounded-3"
          [(ngModel)]="password"
          name="password"
          required
          placeholder="••••••••"
        />
      </div>
      <button type="submit" class="btn btn-gradient w-100 py-3 fw-semibold rounded-3">
        Sign In
      </button>
      <div class="text-center mt-4">
        <p class="text-muted mb-0">
          Don't have an account?
          <a routerLink="/register" class="fw-semibold link-accent ms-1">Create one</a>
        </p>
      </div>
    </form>
  </div>
</div>
