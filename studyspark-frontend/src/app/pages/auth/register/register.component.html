<div class="auth-page alt">
  <div class="floating-shape"></div>
  <div class="floating-shape delay"></div>

  <div class="auth-card shadow-lg p-4 rounded-4">
    <h2 class="text-center mb-3 fw-bold text-gradient-green">🧠 Join StudySpark</h2>
    <p class="text-center text-muted mb-4">Create your learning space today</p>

    <form (ngSubmit)="onRegister()">
      <div class="mb-3">
        <label class="form-label fw-semibold">Full Name</label>
        <input type="text" class="form-control form-control-lg rounded-3"
               [(ngModel)]="fullname" name="fullname" required placeholder="John Doe" />
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Email</label>
        <input type="email" class="form-control form-control-lg rounded-3"
               [(ngModel)]="email" name="email" required placeholder="student@email.com" />
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Password</label>
        <input type="password" class="form-control form-control-lg rounded-3"
               [(ngModel)]="password" name="password" required placeholder="••••••••" />
      </div>
      <button class="btn btn-success-gradient w-100 mt-3 py-2 fw-semibold">Register</button>
      <p class="text-center mt-3 text-muted">
        Already have an account?
        <a routerLink="/login" class="fw-semibold link-accent">Login</a>
      </p>
      
    </form>
  </div>
</div>
